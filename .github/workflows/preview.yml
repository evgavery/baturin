# Тестовое превью на GitHub Pages: https://evgavery.github.io/baturin/
# Каждый пуш в main пересобирает и публикует сайт. Превью закрыто от индексации
# (noindex + robots.txt) скриптом scripts/preview-build.mjs. Боевой деплой на Reg.ru
# этот воркфлоу не затрагивает — там заливается обычный `npm run build` без пост-обработки.
name: preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/preview-build.mjs
        env:
          PREVIEW_BASE: /baturin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
